spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/drivelink
    username: postgres
    password: postgres

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    to: ${MAIL_TO:}

  security:
    jwt:
      secret: ${JWT_SECRET}

admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}