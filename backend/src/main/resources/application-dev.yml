server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/drivelink}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:gabri$}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

# Fallback exclusivo de desenvolvimento. Em produção, defina JWT_SECRET no Render.
app:
  security:
    jwt:
      secret: ${JWT_SECRET:ZHJpdmVsaW5rLWxvY2FsLWRldi1vbmx5LXNlY3JldC0yMDI2}
